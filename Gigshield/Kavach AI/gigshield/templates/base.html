<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GigShield — Protect Your Worker</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #2a2a3a;
      --accent: #f97316;
      --accent2: #fbbf24;
      --text: #f1f1f3;
      --muted: #888899;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 0.5rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text);
      background: var(--surface);
    }

    /* MAIN CONTENT */
    main { padding: 3rem 2.5rem; max-width: 900px; margin: 0 auto; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--muted); margin-bottom: 2.5rem; }

    /* CARDS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1/-1; }
    label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--bg); }

    /* BUTTONS */
    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 2rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: inline-block;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-active { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-triggered { background: rgba(249,115,22,0.15); color: var(--accent); }
    .badge-paid { background: rgba(251,191,36,0.15); color: var(--accent2); }
    .badge-processing { background: rgba(99,102,241,0.15); color: #818cf8; }

    /* ALERT */
    .alert {
      padding: 1rem 1.5rem;
      border-radius: 10px;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
    .alert-warning { background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.3); color: var(--accent); }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    td { padding: 1rem; border-bottom: 1px solid rgba(42,42,58,0.5); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }

    /* WORKER ID BOX */
    .worker-id-box {
      background: rgba(249,115,22,0.08);
      border: 1px solid rgba(249,115,22,0.2);
      border-radius: 10px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .worker-id-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0;
    }

    /* PREMIUM DISPLAY */
    .premium-result {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .premium-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
    }
    .premium-stat .value {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .premium-stat .label { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .premium-result { grid-template-columns: 1fr; }
      nav { padding: 1rem 1.2rem; }
      main { padding: 2rem 1.2rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">⚡ GigShield</a>
    <div class="nav-links">
      <a href="/register" id="nav-register">Register</a>
      <a href="/policy" id="nav-policy">Policy</a>
      <a href="/claims" id="nav-claims">Claims</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Highlight active nav link
    const path = window.location.pathname;
    document.querySelectorAll('.nav-links a').forEach(a => {
      if (a.getAttribute('href') === path) a.classList.add('active');
    });

    // Helper: show alert
    function showAlert(id, msg, type='success') {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = `alert alert-${type}`;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
